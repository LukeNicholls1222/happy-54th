<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SUPER PAPA 54</title>
<meta name="description" content="お誕生日おめでとう">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="stage">
  <canvas id="game" width="240" height="320"></canvas>

  <div id="ui">
    <!-- タイトル -->
    <section class="screen" id="s-title">
      <div class="title-wrap">
        <div class="title-super">SUPER</div>
        <div class="title-main">PAPA</div>
        <div class="title-25">54</div>
      </div>
      <button class="nes-btn blink" id="btn-start">PRESS START</button>
      <p class="hint" data-i18n="hint">画面をタップ</p>
      <button class="nes-btn tiny lang" id="btn-lang">ENGLISH</button>
    </section>

    <!-- 横スクロールのステージ -->
    <section class="screen hidden" id="s-run">
      <div class="runmsg" id="runmsg"></div>
      <div class="clear hidden" id="clear">COURSE CLEAR!</div>
    </section>

    <!-- 登場シーン中のセリフ -->
    <section class="screen hidden" id="s-intro">
      <div class="namebox" id="namebox"></div>
      <button class="nes-btn small ghost skip" id="btn-skip">SKIP ▶</button>
    </section>

    <!-- ろうそく -->
    <section class="screen hidden" id="s-candles">
      <div class="dialog top">
        <p data-i18n="candlesTitle">ろうそくを ぜんぶ けそう</p>
        <p class="sub" data-i18n="candlesSub">画面を <b>長押し</b> して 息をためて、はなす</p>
      </div>
      <div class="meter"><div class="meter-fill" id="breath"></div></div>
      <div class="counter" id="candle-left">のこり 54</div>
      <div class="cheer hidden" id="cheer">
        <div class="cheer-main" data-i18n="cheerMain">おめでとう!!</div>
        <div class="cheer-sub" data-i18n="cheerSub">ろうそく ぜんぶ けせた!</div>
      </div>
    </section>

    <!-- 年齢クイズ -->
    <section class="screen hidden" id="s-quiz">
      <div class="dialog center">
        <p class="q" data-i18n="quizQ">きょうで なんさい?</p>
        <div class="choices" id="choices"></div>
        <p class="answer" id="quiz-answer"></p>
      </div>
    </section>

    <!-- メッセージ -->
    <section class="screen hidden" id="s-end">
      <div class="dialog bottom">
        <p class="hbd">HAPPY BIRTHDAY</p>
        <div id="message"></div>
        <p class="from" id="from"></p>
        <p class="result" id="result"></p>
        <p class="perfect hidden" id="perfect">★ PERFECT ★</p>
        <button class="nes-btn small" id="btn-again" data-i18n="again">もういちど</button>
      </div>
    </section>

    <button class="nes-btn tiny sound" id="btn-sound" aria-label="音">♪ ON</button>
  </div>
</div>
<script src="config.js?v=5"></script>
<script src="js/i18n.js?v=5"></script>
<script src="js/sprites.js?v=5"></script>
<script src="js/world.js?v=5"></script>
<script src="js/run.js?v=5"></script>
<script src="js/main.js?v=5"></script>
</body>
</html>
